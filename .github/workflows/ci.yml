name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: content_scout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check src tests && ruff format --check src tests
        continue-on-error: false
      - run: mypy src
      - run: pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://scout:scout@localhost:5432/content_scout_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
          USE_MOCK_PLATFORM: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  deploy-dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Redeploying api/worker restarts both services — any in-flight job (a run, a deep
      # analysis) gets cancelled mid-way when that happens (arq treats a shutdown signal the
      # same as a job_timeout). Before this, every push to main redeployed all three services
      # unconditionally, including docs-only/frontend-only commits with zero backend changes —
      # confirmed live 2026-08-07/08 as the actual trigger behind a user's overnight Analysis
      # run being cancelled twice by unrelated pushes during an autonomous session. Only
      # redeploy a service whose own directory actually changed in this push.
      - name: Detect changed paths
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # No usable base commit (new branch, force-push, history rewrite) — deploy
            # everything rather than risk silently skipping a real change.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --quiet "$BEFORE" "$AFTER" -- backend/; then
              echo "backend=false" >> "$GITHUB_OUTPUT"
            else
              echo "backend=true" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$BEFORE" "$AFTER" -- frontend/; then
              echo "frontend=false" >> "$GITHUB_OUTPUT"
            else
              echo "frontend=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Deploy backend to Railway DEV
        if: steps.changes.outputs.backend == 'true'
        run: |
          (cd backend && npx -y @railway/cli up --service api --detach --yes)
          (cd backend && npx -y @railway/cli up --service worker --detach --yes)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
      - name: Deploy frontend to Railway DEV
        if: steps.changes.outputs.frontend == 'true'
        run: |
          (cd frontend && npx -y @railway/cli up --service web --detach --yes)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
