name: CD (PROD)

on:
  push:
    tags: ["v*"]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway PROD
        run: |
          (cd backend && npx railway up --service api --detach)
          (cd backend && npx railway up --service worker --detach)
          (cd frontend && npx railway up --service web --detach)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
