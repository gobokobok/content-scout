name: CD (PROD)

on:
  push:
    tags: ["v*"]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway PROD
        run: |
          (cd backend && npx -y @railway/cli up --service api --detach --yes)
          (cd backend && npx -y @railway/cli up --service worker --detach --yes)
          (cd frontend && npx -y @railway/cli up --service web --detach --yes)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
